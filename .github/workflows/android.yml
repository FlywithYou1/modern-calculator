name: Android构建

on:
  push:
    branches: [ main, master ]
    paths: [ 'src/**', 'src-tauri/**', 'package.json' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'debug'
        type: choice
        options:
        - debug
        - release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-build:
    name: Android构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      
      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      
      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 26.1.10909125
      
      - name: 安装前端依赖
        run: npm install
      
      - name: 构建前端
        run: npm run build
      
      - name: 初始化 Android 项目
        run: |
          npm run android:init || echo "Android项目可能已存在"
          echo "Android 项目状态:"
          ls -la src-tauri/gen/android/ 2>/dev/null || echo "需要初始化"
      
      - name: 构建 Android APK
        run: |
          echo "开始 Android 构建..."
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export NDK_HOME=$ANDROID_NDK_HOME
          npm run android:build || npm run tauri android build --verbose
        continue-on-error: true
      
      - name: 收集构建产物
        run: |
          echo "=== Android 构建产物 ==="
          find src-tauri -name "*.apk" -o -name "*.aab" 2>/dev/null || echo "无 Android 构建产物"
          echo ""
          echo "=== 前端构建产物 ==="
          ls -la dist/ 2>/dev/null || echo "无前端构建产物"
      
      - name: 上传 Android 产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build-${{ github.run_number }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
            dist/**/*
          retention-days: 7
        continue-on-error: true