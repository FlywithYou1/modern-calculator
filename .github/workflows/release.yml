name: Release Tauri App

on:
  push:
    branches: ['main', 'release']
    tags: ['v*']
  pull_request:
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 质量门检查
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      
      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Lint and Format check
        run: |
          npm run lint
          npm run format:check
      
      - name: Frontend tests
        run: npm test -- --run
      
      - name: Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml
      
      - name: Build frontend
        run: npm run build

  # 跨平台构建和发布
  build-and-release:
    needs: quality-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest'
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust target
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libappindicator3-dev librsvg2-dev patchelf || true
          (sudo apt-get install -y libwebkit2gtk-4.1-dev) || (sudo apt-get install -y libwebkit2gtk-4.0-dev)

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tauriScript: 'npm'
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: '科学计算器 v__VERSION__'
          releaseBody: |
            ## 🧮 科学计算器更新

            ### 新功能
            - 基础和科学计算功能
            - 现代化用户界面
            - 主题切换支持
            - 性能模式优化
            - 键盘快捷键支持
            - 计算历史记录

            ### 技术特性
            - GPU 加速动画
            - 响应式设计
            - 多平台支持
            - 高性能渲染

            ### 支持平台
            - Windows 10/11
            - macOS 10.15+
            - Linux (Ubuntu 18.04+)

            更多详细信息请查看 [README.md](https://github.com/${{ github.repository }}/blob/main/README.md)
          releaseDraft: true
          prerelease: false
          includeDebug: false
          includeRelease: true
          updaterJsonKeepUniversal: false

      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: tauri-bundles-${{ matrix.platform }}
          path: src-tauri/target/release/bundle/**/*
          retention-days: 7

  # 移动端构建 (未来扩展)
  mobile-build:
    needs: quality-gate
    if: false # 暂时禁用，等待 Tauri 移动端稳定
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      # TODO: 添加 iOS/Android 构建步骤
      # 参考 Tauri 官方文档和 Capacitor/Flutter 集成
      
      - name: Placeholder for mobile builds
        run: |
          echo "移动端构建将在未来版本中实现"
          echo "计划支持: iOS, Android"
          echo "技术方案: Tauri + Capacitor/Flutter"
