name: 🚀 自动发布

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '版本号 (例如: v2.1.0)'
        required: true
        default: 'v2.0.0'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==================== 创建 Release ====================
  create-release:
    name: 📦 创建 Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create_release.outputs.id }}
      upload_url: ${{ steps.create_release.outputs.upload_url }}
      version: ${{ steps.get_version.outputs.version }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🏷️ 获取版本号
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "📦 构建版本: $VERSION"

      - name: 🎉 创建 Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Modern Calculator ${{ steps.get_version.outputs.version }}
          body: |
            ## 🧮 Modern Calculator ${{ steps.get_version.outputs.version }}
            
            ### ✨ 功能特性
            - 🔢 高精度科学计算（rust_decimal 实现）
            - 📊 矩阵运算（加减乘、转置、行列式、求逆、LU分解、迹、秩等）
            - 🔬 微积分支持（符号/数值求导、数值积分）
            - 📈 函数图像绘制
            - 🔢 复数运算
            - 📐 单位转换、进制转换
            - 📊 统计分析
            - 🎨 深色/浅色主题
            
            ### 📥 下载
            | 平台 | 格式 | 说明 |
            |------|------|------|
            | 🪟 Windows | `.msi` / `.exe` | 安装包 |
            | 🐧 Linux | `.deb` / `.AppImage` | Debian 或通用 |
            | 🍎 macOS | `.dmg` | 磁盘镜像 |
            | 🤖 Android | `.apk` | 安装包 |
            
            ### 🛠️ 技术栈
            - Frontend: Vue 3 + TypeScript + Vite
            - Backend: Rust (nightly) + Tauri 2.0
            
            ---
            *自动构建于 ${{ github.sha }}*
          draft: false
          prerelease: ${{ contains(steps.get_version.outputs.version, 'alpha') || contains(steps.get_version.outputs.version, 'beta') || contains(steps.get_version.outputs.version, 'rc') }}

  # ==================== Windows 构建 ====================
  build-windows:
    name: 🪟 Windows 发布
    needs: create-release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装 MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-toolchain

      - name: 🦀 设置 Rust (nightly-gnu)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-x86_64-pc-windows-gnu
          targets: x86_64-pc-windows-gnu
          components: rustfmt, clippy

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: 📦 构建 Windows 应用
        shell: pwsh
        env:
          CARGO_BUILD_TARGET: x86_64-pc-windows-gnu
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          npm run tauri build

      - name: 📋 列出产物
        shell: pwsh
        run: |
          Write-Host "=== 🪟 Windows 构建产物 ===" -ForegroundColor Cyan
          $paths = @(
            "src-tauri/target/x86_64-pc-windows-gnu/release/bundle",
            "src-tauri/target/release/bundle"
          )
          foreach ($path in $paths) {
            if (Test-Path $path) {
              Get-ChildItem -Path $path -Recurse -File | ForEach-Object {
                Write-Host "  $($_.FullName) - $([math]::Round($_.Length / 1MB, 2)) MB"
              }
            }
          }

      - name: 📤 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

      - name: 📤 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-gnu/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 30
          if-no-files-found: warn

  # ==================== Linux 构建 ====================
  build-linux:
    name: 🐧 Linux 发布
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: 🦀 设置 Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: 📦 构建 Linux 应用
        run: npm run tauri build

      - name: 📋 列出产物
        run: |
          echo "=== 🐧 Linux 构建产物 ==="
          find src-tauri/target/release/bundle -type f -exec ls -lh {} \;

      - name: 📤 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

      - name: 📤 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 30

  # ==================== macOS 构建 ====================
  build-macos:
    name: 🍎 macOS 发布
    needs: create-release
    runs-on: macos-latest
    permissions:
      contents: write

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🦀 设置 Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: 📦 构建 macOS 应用 (Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        continue-on-error: true

      - name: 📦 构建 macOS 应用 (Native)
        if: failure()
        run: npm run tauri build

      - name: 📋 列出产物
        run: |
          echo "=== 🍎 macOS 构建产物 ==="
          find src-tauri/target -name "*.dmg" 2>/dev/null | head -10

      - name: 📤 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg

      - name: 📤 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 30
          if-no-files-found: warn

  # ==================== Android 构建 ====================
  build-android:
    name: 🤖 Android 发布
    needs: create-release
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    if: ${{ !contains(github.event.head_commit.message, '[skip-android]') }}

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 📱 安装 NDK
        run: |
          sdkmanager --install "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

      - name: 🦀 设置 Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔧 初始化 Android 项目
        run: npm run tauri android init
        continue-on-error: true

      - name: 📦 构建 Android APK
        run: npm run tauri android build --apk
        continue-on-error: true

      - name: 📤 上传到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
        continue-on-error: true

      - name: 📤 上传 Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-release
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
        continue-on-error: true

  # ==================== 发布汇总 ====================
  summary:
    name: 📊 发布汇总
    needs: [create-release, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📋 汇总结果
        run: |
          echo "## 🎉 发布汇总"
          echo ""
          echo "| 平台 | 状态 |"
          echo "|------|------|"
          echo "| 🪟 Windows | ${{ needs.build-windows.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
          echo "| 🐧 Linux | ${{ needs.build-linux.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
          echo "| 🍎 macOS | ${{ needs.build-macos.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
          echo ""
          echo "📦 版本: ${{ needs.create-release.outputs.version }}"
          echo "🔗 下载: https://github.com/${{ github.repository }}/releases/tag/${{ needs.create-release.outputs.version }}"
