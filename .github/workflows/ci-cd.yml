name: CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # 代码质量检查
  quality:
    name: 代码质量检查
    runs-on: ubuntu-22.04
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 安装依赖
        run: npm ci
        
      - name: TypeScript 类型检查
        run: npm run typecheck
        
      - name: ESLint 代码检查
        run: npm run lint
        
      - name: 运行测试
        run: npm run test:run
        
      - name: 构建检查
        run: npm run build

      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  # Rust 后端检查 (仅编译检查，不构建完整应用)
  rust-check:
    name: Rust 后端检查
    runs-on: ubuntu-22.04
    needs: quality
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: 检查 Rust 语法和类型
        working-directory: src-tauri
        run: cargo check --lib --bins

      - name: 运行 Rust 单元测试 (仅库测试)
        working-directory: src-tauri
        run: cargo test --lib --no-default-features
        continue-on-error: true

  # Linux 完整构建 (需要系统依赖)
  build-linux:
    name: Linux 完整构建
    runs-on: ubuntu-22.04
    needs: [quality, rust-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: 设置 Rust
        uses: dtolnay/rust-toolchain@stable

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装依赖
        run: npm ci

      - name: 尝试 Tauri 构建
        run: npm run tauri:build
        continue-on-error: true

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: linux-build
          path: |
            src-tauri/target/release/bundle/
            dist/
          retention-days: 7