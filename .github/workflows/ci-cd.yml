name: CI/CD 完整流水线

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_android:
        description: '是否构建Android'
        required: false
        default: false
        type: boolean

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基础质量检查和前端构建
  frontend:
    name: 前端构建与质量检查
    runs-on: ubuntu-latest
    outputs:
      build-success: ${{ steps.build.outcome == 'success' }}
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          
      - name: 安装项目依赖
        run: npm ci
        
      - name: TypeScript 类型检查
        run: npm run typecheck
        
      - name: ESLint 代码质量检查
        run: npm run lint
        
      - name: 运行单元测试
        run: npm run test:run
        
      - name: 构建前端应用
        id: build
        run: npm run build
          
      - name: 验证构建产物
        run: |
          echo "=== 📦 构建产物验证 ==="
          if [ ! -f "dist/index.html" ]; then
            echo "❌ 构建失败: 主入口文件缺失"
            exit 1
          fi
          
          echo "✅ 构建产物验证通过"
          echo ""
          echo "📊 构建统计:"
          ls -lah dist/
          echo ""
          echo "💾 总大小: $(du -sh dist/ | cut -f1)"
          
      - name: 上传前端构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-build-${{ github.run_number }}
          path: |
            dist/**/*
            package.json
            README.md
          retention-days: 7

  # 跨平台构建 (Android + 桌面端)
  cross-platform:
    name: 跨平台构建 (Android + 桌面)
    runs-on: ubuntu-latest
    needs: frontend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' || github.event.inputs.build_android == 'true'
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
      
      - name: 设置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: 设置 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      
      - name: Rust 构建缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      
      - name: 设置 Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools: 34.0.0
          ndk-version: 26.1.10909125
      
      - name: 安装前端依赖
        run: npm ci
      
      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-build-${{ github.run_number }}
          path: .
      
      - name: Android 环境验证
        run: |
          echo "🤖 Android 构建环境检查"
          echo "ANDROID_HOME: ${ANDROID_HOME:-未设置}"
          echo "NDK_HOME: ${NDK_HOME:-未设置}"
          echo "Java 版本: $(java -version 2>&1 | head -1)"
          echo "Rust targets: $(rustup target list --installed | grep android || echo '无Android targets')"
          
          if [ -f "src-tauri/keystore/calculator.keystore" ]; then
            echo "✅ 签名配置已就绪"
          else
            echo "⚠️ 签名配置缺失，使用调试证书"
          fi
      
      - name: 初始化 Android 项目
        run: |
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "🔧 初始化 Android 项目结构..."
            npm run android:init || npx tauri android init
          else
            echo "✅ Android 项目已存在"
          fi
          
          echo "📁 Android 项目结构:"
          ls -la src-tauri/gen/android/ 2>/dev/null || echo "项目结构创建中..."
      
      - name: 构建跨平台应用
        run: |
          echo "🚀 开始跨平台构建..."
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          export NDK_HOME=$ANDROID_NDK_HOME
          
          echo "📱 构建 Android APK..."
          # 尝试使用项目脚本构建
          npm run android:build || {
            echo "⚠️ 项目脚本构建失败，尝试直接使用 Tauri CLI"
            npx tauri android build --verbose
          }
          
          echo ""
          echo "🖥️ 准备桌面端构建配置..."
          # 桌面端构建配置检查 (在有Rust环境时可以实际构建)
          echo "✅ 桌面构建配置验证:"
          echo "  - Windows: .msi 安装包 (需要 Windows 环境)"
          echo "  - macOS: .dmg 镜像 (需要 macOS 环境)" 
          echo "  - Linux: .deb/.AppImage (当前环境可构建)"
          
          # 如果环境支持，可以构建Linux版本
          if command -v cargo &> /dev/null; then
            echo "🐧 尝试构建 Linux 版本..."
            npm run tauri:build || echo "⚠️ 桌面端构建需要完整 Rust 环境"
          fi
        continue-on-error: true
      
      - name: 收集构建结果
        run: |
          echo "=== 📦 跨平台构建结果汇总 ==="
          echo ""
          echo "📱 Android 构建产物:"
          find . -name "*.apk" -o -name "*.aab" 2>/dev/null | head -10 || echo "  无 APK/AAB 产物找到"
          
          echo ""
          echo "🖥️ 桌面端构建产物:"
          find . -name "*.deb" -o -name "*.AppImage" -o -name "*.msi" -o -name "*.dmg" 2>/dev/null | head -10 || echo "  桌面端产物 (需要对应平台环境)"
          
          echo ""
          echo "🌐 前端构建产物:"
          ls -la dist/ 2>/dev/null && echo "  ✅ 前端资源: dist/" || echo "  ❌ 前端资源缺失"
          
          echo ""
          echo "📂 项目结构:"
          ls -la src-tauri/gen/android/ 2>/dev/null && echo "  ✅ Android 项目: src-tauri/gen/android/" || echo "  ❌ Android 项目缺失"
          ls -la src-tauri/target/ 2>/dev/null && echo "  ✅ Rust 构建目标: src-tauri/target/" || echo "  ⚠️ 桌面构建未执行"
      
      - name: 上传跨平台构建产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cross-platform-build-${{ github.run_number }}
          path: |
            src-tauri/gen/android/app/build/outputs/**/*.apk
            src-tauri/gen/android/app/build/outputs/**/*.aab
            src-tauri/gen/android/
            src-tauri/target/release/bundle/**/*
            dist/
          retention-days: 7
        continue-on-error: true

  # 构建状态汇总
  build-summary:
    name: 构建状态汇总
    runs-on: ubuntu-latest
    needs: [frontend, cross-platform]
    if: always()
    
    steps:
      - name: 汇总构建结果
        run: |
          echo "=== 🎯 构建流水线汇总 ==="
          echo ""
          
          # 前端构建状态
          if [ "${{ needs.frontend.result }}" == "success" ]; then
            echo "✅ 前端构建: 成功"
          else
            echo "❌ 前端构建: ${{ needs.frontend.result }}"
          fi
          
          # 跨平台构建状态 (如果运行)
          if [ "${{ needs.cross-platform.result }}" != "skipped" ]; then
            if [ "${{ needs.cross-platform.result }}" == "success" ]; then
              echo "✅ 跨平台构建 (Android + 桌面): 成功"
            else
              echo "⚠️ 跨平台构建: ${{ needs.cross-platform.result }}"
            fi
          else
            echo "⏭️ 跨平台构建: 已跳过"
          fi
          
          echo ""
          echo "🔗 构建产物下载: GitHub Actions Artifacts"
          echo "📅 保留时间: 7天"