name: 高效CI检查

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基础质量检查
  quality_check:
    name: 质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          
      - name: 安装依赖
        run: npm ci
        
      - name: TypeScript类型检查
        run: npm run typecheck
        
      - name: ESLint代码检查  
        run: npm run lint
        
      - name: 运行单元测试
        run: npm run test:run
        
      - name: 构建前端
        run: npm run build
          
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_number }}
          path: dist/**/*
          retention-days: 7
          
      - name: 验证构建产物
        run: |
          echo "=== 构建产物验证 ==="
          ls -la dist/
          du -sh dist/
          echo "✅ 构建产物验证完成"
