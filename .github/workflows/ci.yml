name: 🔄 持续集成

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  NODE_VERSION: '22'  # Node.js 22 LTS
  JAVA_VERSION: '21'  # Java 21 LTS (Gradle 不支持 Java 25)
  NDK_VERSION: '27.2.12479018'  # Android NDK r27c LTS

jobs:
  # ==================== 前端检查 ====================
  frontend-check:
    name: 🎨 前端构建
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📚 安装依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: ✅ 验证产物
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ 构建失败"
            exit 1
          fi
          echo "✅ 前端构建成功"
          ls -lah dist/

      - name: 📤 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/
          retention-days: 7

  # ==================== Linux 构建 ====================
  build-linux:
    name: 🐧 Linux 构建
    needs: frontend-check
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            pkg-config \
            libglib2.0-dev \
            libgdk-pixbuf2.0-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: 🦀 设置 Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: ✅ Rust 检查
        working-directory: src-tauri
        run: cargo check --workspace

      - name: 🧪 运行测试
        working-directory: src-tauri
        run: cargo test --workspace

      - name: 📦 构建 Tauri 应用
        run: npm run tauri build

      - name: 📋 列出产物
        run: |
          echo "=== 🐧 Linux 构建产物 ==="
          find src-tauri/target/release/bundle -type f -exec ls -lh {} \; 2>/dev/null || echo "无产物"

      - name: 📤 上传 Linux 安装包
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          retention-days: 7
          if-no-files-found: warn

  # ==================== Windows 构建 ====================
  build-windows:
    name: 🪟 Windows 构建
    needs: frontend-check
    runs-on: windows-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🦀 设置 Rust (nightly-msvc)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-pc-windows-msvc
          components: rustfmt, clippy

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: ✅ Rust 检查
        shell: pwsh
        run: |
          cd src-tauri
          cargo check --workspace

      - name: 🧪 运行测试
        shell: pwsh
        run: |
          cd src-tauri
          cargo test --workspace

      - name: 📦 构建 Tauri 应用
        shell: pwsh
        run: |
          npm run tauri build

      - name: 📋 列出产物
        shell: pwsh
        run: |
          Write-Host "=== 🪟 Windows 构建产物 ===" -ForegroundColor Cyan
          $path = "src-tauri/target/release/bundle"
          if (Test-Path $path) {
            Get-ChildItem -Path $path -Recurse -File | ForEach-Object {
              Write-Host "  $($_.FullName) - $([math]::Round($_.Length / 1MB, 2)) MB"
            }
          }

      - name: 📤 上传 Windows 安装包
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          retention-days: 7
          if-no-files-found: warn

  # ==================== macOS 构建 ====================
  build-macos:
    name: 🍎 macOS 构建
    needs: frontend-check
    runs-on: macos-latest

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🦀 设置 Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: ✅ Rust 检查
        working-directory: src-tauri
        run: cargo check --workspace

      - name: 🧪 运行测试
        working-directory: src-tauri
        run: cargo test --workspace

      - name: 📦 构建 Tauri 应用 (Universal)
        run: npm run tauri build -- --target universal-apple-darwin
        continue-on-error: true

      - name: 📦 构建 Tauri 应用 (Native)
        if: failure()
        run: npm run tauri build

      - name: 📋 列出产物
        run: |
          echo "=== 🍎 macOS 构建产物 ==="
          find src-tauri/target -name "*.dmg" -o -name "*.app" 2>/dev/null | head -20

      - name: 📤 上传 macOS 安装包
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
          retention-days: 7
          if-no-files-found: warn

  # ==================== Android 构建 ====================
  build-android:
    name: 🤖 Android 构建
    needs: frontend-check
    runs-on: ubuntu-24.04

    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: ☕ 设置 Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}

      - name: 🤖 设置 Android SDK
        uses: android-actions/setup-android@v3

      - name: 📱 安装 NDK
        run: |
          sdkmanager --install "ndk;${{ env.NDK_VERSION }}"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/${{ env.NDK_VERSION }}" >> $GITHUB_ENV

      - name: 🔑 准备 Android 调试签名
        run: |
          mkdir -p $HOME/.android
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore $HOME/.android/debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          echo "TAURI_ANDROID_KEYSTORE_PATH=$HOME/.android/debug.keystore" >> $GITHUB_ENV
          echo "TAURI_ANDROID_KEYSTORE_PASSWORD=android" >> $GITHUB_ENV
          echo "TAURI_ANDROID_KEY_PASSWORD=android" >> $GITHUB_ENV
          echo "TAURI_ANDROID_KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV

      - name: 🦀 设置 Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: 📦 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 💾 Rust 缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: 📚 安装前端依赖
        run: npm ci

      - name: 🔨 构建前端
        run: npm run build

      - name: 🔧 初始化 Android 项目
        run: npm run tauri android init

      - name: 📦 构建 Android APK (Debug Signed)
        # 使用 --debug 确保 APK 使用调试密钥签名，避免 "PackageInfo is null" 错误
        run: npm run tauri android build -- --debug --apk

      - name: 📋 列出产物
        run: |
          echo "=== 🤖 Android 构建产物 ==="
          find src-tauri/gen/android -name "*.apk" 2>/dev/null | head -10 || echo "无 APK 产物"

      - name: 📤 上传 Android APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: warn

  # ==================== 构建汇总 ====================
  summary:
    name: 📊 构建汇总
    needs: [frontend-check, build-linux, build-windows, build-macos, build-android]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: 📋 汇总结果
        run: |
          echo "## 🎯 跨平台构建汇总"
          echo ""
          echo "| 平台 | 状态 |"
          echo "|------|------|"
          echo "| 🎨 前端 | ${{ needs.frontend-check.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
          echo "| 🐧 Linux | ${{ needs.build-linux.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
          echo "| 🪟 Windows | ${{ needs.build-windows.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
          echo "| 🍎 macOS | ${{ needs.build-macos.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
          echo "| 🤖 Android | ${{ needs.build-android.result == 'success' && '✅ 成功' || '❌ 失败' }} |"
