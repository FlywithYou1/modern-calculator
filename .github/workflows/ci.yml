name: ci

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Node & Rust Quality Gates
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20]
        rust: [stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
      - name: Install deps
        run: npm ci
      - name: Type Check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Frontend Tests
        run: npm run test:run -- --run
      - name: Build Frontend
        run: npm run build
      - name: Rust fmt
        run: cargo fmt -- --check
        working-directory: src-tauri
      - name: Rust clippy
        run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: Rust tests
        run: cargo test --all --verbose
        working-directory: src-tauri
      - name: Placeholder artifact step
        if: always()
        run: echo "Add coverage/artifact upload here later"

  windows_tauri_build:
    name: Windows Tauri Smoke Build
    runs-on: windows-latest
    needs: build_and_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri
      - name: Install deps
        run: npm ci
      - name: Frontend build
        run: npm run build
      - name: Backend build
        run: cargo build --release
        working-directory: src-tauri
      - name: Summarize
        run: |
          echo "Build finished at: $(Get-Date)" | Out-File build-summary.txt
          echo "dist exists: $(Test-Path dist)" | Out-File -Append build-summary.txt
          echo "release dir exists: $(Test-Path src-tauri/target/release)" | Out-File -Append build-summary.txt
      - uses: actions/upload-artifact@v4
        with:
          name: build-summary
          path: build-summary.txt
