name: 简化CI检查

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 基础质量检查
  quality_check:
    name: 质量检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          
      - name: 安装依赖
        run: npm install
        
      - name: 前端检查
        run: |
          echo "=== 前端质量检查 ==="
          npm run typecheck
          npm run lint
          npm run test:run
          npm run build
          echo "✅ 前端检查完成"
          
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-${{ github.run_number }}
          path: dist/**/*
          retention-days: 7
