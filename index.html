<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="现代化跨平台科学计算器 - 高精度运算、优雅界面、科技感设计" />
  <meta name="keywords" content="科学计算器,高精度计算,跨平台,现代化设计" />
  <meta name="theme-color" content="#1e293b" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="format-detection" content="telephone=no" />
  
  <title>科学计算器 - 高精度跨平台计算工具</title>
  
  <!-- 图标和清单 -->
  <link rel="icon" type="image/png" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  
  <!-- 预加载关键资源 -->
  <link rel="preload" href="/src/styles/index.scss" as="style" />
  <link rel="preload" href="/src/index.ts" as="script" />
  
  <!-- CSS 重置和基础样式 -->
  <style>
    /* 避免 FOUC (Flash of Unstyled Content) */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    html {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }
    
    body {
      height: 100%;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      overflow: hidden;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      user-select: none;
    }
    
    #root {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    /* 加载动画 */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      color: white;
    }
    
    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="loading">
      <div class="loading-spinner"></div>
      <div>正在启动计算器...</div>
    </div>
  </div>
  
  <script type="module" src="/src/index.ts"></script>
</body>
</html>
