[package]
name = "modern-calculator"
version = "2.0.0"
description = "现代化跨平台科学计算器 - 高精度运算引擎"
authors = ["Scientific Calculator Team"]
license = "MIT"
repository = "https://github.com/FlywithYou1/modern-calculator"
edition = "2024"


[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.1", features = [] }

[dependencies]
# Tauri 核心 (简化版本)
serde_json = { version = "1.0.145", features = ["preserve_order"] }
serde = { version = "1.0.226", features = ["derive"] }
tauri = { version = "2.8.5", features = ["devtools", "tray-icon"] }
tauri-plugin-store = { version = "2.4.0" }
tauri-plugin-haptics = { version = "2.3.0" }

# 高精度数学计算库 (核心)
rust_decimal = { version = "1.38.0", features = ["serde-with-str", "maths"] }
num-bigint = { version = "0.4.6", features = ["serde"] }
num-traits = "0.2.19"
libm = "0.2.15"
num-complex = "0.4.6"

# 异步运行时 (简化)
tokio = { version = "1.47.1", features = ["rt", "sync", "macros"] }
anyhow = "1.0.100"
thiserror = "2.0.17"
tracing = "0.1.41"
log = "0.4.28"

# 序列化 (核心)
bincode = "2.0.1"

# 时间处理 (核心)
chrono = { version = "0.4.42", features = ["serde"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }

# 移动端平台特定依赖
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
android_logger = "0.15.1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
precision-tests = []
advanced-math = ["rust_decimal/maths"]

# 性能优化配置
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
