[package]
name = "modern-calculator"
version = "2.0.0"
description = "现代化跨平台科学计算器 - 高精度运算引擎"
authors = ["Scientific Calculator Team"]
license = "MIT"
repository = "https://github.com/FlywithYou1/modern-calculator"
edition = "2021"
rust-version = "1.70.0"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
# Tauri 核心 (简化版本)
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.8", features = ["devtools"], default-features = false }

# 高精度数学计算库 (核心)
rust_decimal = { version = "1.37", features = ["serde-with-str", "maths"] }
num-bigint = { version = "0.4", features = ["serde"] }
num-traits = "0.2"
libm = "0.2"

# 异步运行时 (简化)
tokio = { version = "1.40", features = ["rt", "sync"] }
anyhow = "1.0"
thiserror = "1.0"

# 序列化 (核心)
bincode = "1.3"

# 时间处理 (核心)
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }

# 移动端平台特定依赖
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
android_logger = "0.13"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
precision-tests = []
advanced-math = ["rust_decimal/maths"]

# 性能优化配置
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
